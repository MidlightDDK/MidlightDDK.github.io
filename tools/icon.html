<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Touch icon</title>
  <!-- Source for site/apple-touch-icon.png (180x180; iOS rounds the corners itself). Rebuild with: node tools/render.mjs -->
  <style>
    html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; background: #15171b; }
    body { display: grid; place-items: center; }
    .t { margin-top: -10px; color: #fff; font: 700 72px "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; letter-spacing: 1px; }
    .u { position: absolute; left: 45px; top: 128px; width: 90px; height: 10px; border-radius: 5px; background: #3ddc97; }
  </style>
</head>
<body>
  <div class="t">MA</div>
  <div class="u"></div>
</body>
</html>
